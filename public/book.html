<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>꿈 — 그림책 보기 | Again, Emongc</title>
  <meta name="description" content="AI에게 모든 걸 맡긴 엄마의 이야기, 그림책 〈꿈〉을 넘겨 보세요.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/book.css?v=7">
</head>
<body>
  <header class="bk-top">
    <a class="bk-back" href="index.html#works">← WORKS로 돌아가기</a>
    <p class="bk-label"><span class="bk-tape">그림책</span> 꿈 <small>글·그림 홍선미</small></p>
  </header>

  <div class="bk-views" role="group" aria-label="보기 방식">
    <button type="button" class="bk-view on" id="viewStrip" aria-pressed="true">가로로 보기</button>
    <button type="button" class="bk-view" id="viewAll" aria-pressed="false">전체보기</button>
  </div>

  <main class="bk-main">
    <!-- 가로로 보기: 한 줄로 쭉, 옆으로 밀어서 -->
    <section class="bk-strip-wrap" id="stripWrap" aria-label="그림책 꿈, 가로로 보기">
      <div class="bk-strip" id="strip" tabindex="0"></div>
      <nav class="bk-ctrl" aria-label="넘기기">
        <button type="button" class="bk-btn" id="bkPrev" aria-label="왼쪽으로">←</button>
        <p class="bk-count" id="bkCount" aria-live="polite">1 / 24</p>
        <button type="button" class="bk-btn" id="bkNext" aria-label="오른쪽으로">→</button>
      </nav>
      <div class="bk-bar" aria-hidden="true"><span id="bkBar"></span></div>
    </section>

    <!-- 전체보기: 1~24쪽 순서대로 -->
    <section class="bk-all" id="allView" aria-label="그림책 꿈, 전체보기" hidden>
      <ol class="bk-grid" id="grid"></ol>
    </section>

    <div class="bk-end" id="bkEnd">
      <p class="bk-end-title">끝.</p>
      <p class="bk-end-text">읽어 주셔서 고마워요.</p>
      <a class="bk-end-link" href="index.html#works">이 책이 만들어진 과정 →</a>
    </div>
  </main>

  <script src="js/book.js?v=7"></script>
</body>
</html>
